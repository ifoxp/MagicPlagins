# ═══════════════════════════════════════════════════════════════════════════
#  МАГІЯ — налаштування балансу
# ═══════════════════════════════════════════════════════════════════════════
#
#  Тут лежать усі числа, які використовують закляття. Змінив — зберіг —
#  /magic reload. Перезапуск сервера не потрібен.
#
#  Якщо якесь значення прибрати, плагін візьме вбудоване за замовчуванням.
#  Тому файл може бути неповним: лишай тільки те, що справді хочеш змінити.
#
#  ОДИНИЦІ ВИМІРУ:
#    damage    — половинки сердець. У гравця їх 20, тобто 10 сердець.
#                damage: 8.0  →  у грі покажеться 4.0♥
#    mana      — скільки з'їдає один каст. Для каналів (вогнемет, хуртовина)
#                це витрата за один "біт", тобто 4 рази на секунду.
#    cooldown  — мілісекунди між кастами. 1000 = 1 секунда.
#    range     — радіус вибуху або дальність, у блоках.
#    duration  — скільки живе ефект, у тіках. 20 тіків = 1 секунда.
#
# ═══════════════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────── ЗАГАЛЬНЕ ──

# ПРОБИВАННЯ БРОНІ — яка частка урону проходить крізь броню, від 0.0 до 1.0.
#
# Звичайна броня з'їдає до 80% удару. Тобто при 0.0 гравець у неттериті
# майже не відчуває магії. При 1.0 броня взагалі перестає щось означати —
# це так само погано, тільки з іншого боку.
#
# Як це працює: урон ділиться на дві частини. Пробита частина йде як
# магічний урон (те саме правило, що в зілля Instant Damage — ігнорує
# захист), решта — як звичайний удар, який броня ріже.
#
#   0.0  — броня працює повністю, як у ванілі
#   0.5  — половина проходить незалежно від екіпу
#   1.0  — броня не важлива
#
# Приклад при 10 урону проти неттериту:
#   0.0 → долетить 2.0    0.5 → долетить 6.0    1.0 → долетить 10.0
#
# Підніми пізніше, якщо додаватимеш прокачку, де пробивання росте з рівнем.
armour-pierce: 0.5

# МНОЖНИК УРОНУ — множиться на ВСЕ одразу.
# Швидкий спосіб зробити всю магію сильнішою або слабшою, не чіпаючи
# кожне закляття окремо.
#   1.0 — як задумано
#   1.5 — усе б'є на 50% сильніше
#   0.7 — усе б'є на 30% слабше
damage-multiplier: 1.0


# ─────────────────────────────────────────────────────────────────── МАНА ──

mana:
  # Розмір пулу. Це саме число показує BossBar.
  maximum: 1000

  # Відновлення за секунду, коли паличка НЕ в руках.
  regen: 50

  # Відновлення за секунду, коли паличка В руках (стійка активна).
  # Свідомо менше: тримати готовність коштує тобі швидкого відкату.
  regen-in-stance: 15

  # Пауза після витрати, перш ніж мана почне відновлюватися (мілісекунди).
  # Без неї можна було б спамити закляттями без відчутної ціни.
  regen-delay: 800

  # Блокування після того, як мана впала до нуля (мілісекунди).
  # Поки воно триває, кастувати нічого не можна взагалі.
  exhaust: 3000


# ═══════════════════════════════════════════════════════════ СТИХІЯ ВОГНЮ ══
#
#  Вогонь — це урон і горіння. Б'є сильніше за лід на кожному рівні,
#  відкидає далі, і має форму на швидкість. Пасивка: вогонь не шкодить.
#
fire:

  # ─── ОСНОВНА АТАКА (ЛКМ) ───
  #
  # Заклікування ЛКМ підвищує рівень залпу: 1 → 3 → 5 → 8 магмових кубів.
  # Кожен рівень — більший урон, більший радіус і сильніший відкид.
  # Куби летять кільцем поперек траєкторії.
  bolt:
    # Мана за найслабший постріл (1 куб).
    mana-base: 10
    # Скільки додається до мани на повному заряді (8 кубів).
    # Тобто максимальний постріл коштує mana-base + mana-per-charge.
    mana-per-charge: 35

    # 1 КУБ — один клік. Дешево, без відкиду.
    tier-1:
      damage: 3.0
      knockback: 0.0

    # 3 КУБИ — легке заклікування. Відкид просто стопить людину.
    tier-3:
      damage: 7.0
      knockback: 0.4

    # 5 КУБІВ — відкид приблизно як від удару мечем.
    tier-5:
      damage: 11.0
      knockback: 0.85

    # 8 КУБІВ — зелене полум'я. Відкид як від меча з чаруванням Knockback.
    tier-8:
      damage: 17.0
      knockback: 1.5

  # ─── ВОГНЕМЕТ (SHIFT + ЛКМ) ───
  #
  # Чим довше заклікуєш без пауз, тим вужчий і дальший струмінь.
  # Спочатку розсіяний і короткий, через 3 секунди — концентрований.
  # Три кольори полум'я по довжині: оранж → синій → зелений.
  channel:
    # Витрата за біт (4 рази на секунду).
    mana: 3
    # Урон за влучання на початку каналу (розсіяний струмінь).
    damage-min: 1.5
    # Урон за влучання на повній концентрації.
    damage-max: 5.0
    # Дальність на початку, у блоках.
    reach-min: 4.0
    # Дальність на повній концентрації.
    reach-max: 11.0

  # ─── ФОРМА ІНФЕРНО (тримати ПКМ 3 секунди) ───
  #
  # Крила з полум'я, роги, швидкість і високий стрибок.
  # Вихід: Shift + S S. Форма для того, щоб догнати або втекти.
  form:
    # Витрата мани за секунду, поки форма активна.
    drain: 22
    # Яка частка пулу потрібна, щоб увійти (0.25 = чверть).
    minimum-mana: 0.25
    # Додаткова швидкість, поверх зілля Speed II. 0.35 = +35%.
    speed-bonus: 0.35
    # Рівень стрибка (0 = Jump Boost I, 2 = Jump Boost III).
    jump-level: 2

  # ─── ЗАКЛЯТТЯ НА ЖЕСТАХ ───
  spells:
    # W W — ривок уперед
    dash:      { mana: 14, cooldown: 700 }
    # S S — відскок назад
    backstep:  { mana: 12, cooldown: 600 }
    # A A / D D — ухил убік
    dodge:     { mana: 12, cooldown: 600 }
    # Space Space — стрибок угору
    leap:      { mana: 18, cooldown: 900 }

    # W W → ПКМ — таран: циліндр вогню летить уперед і відкидає
    charge:    { mana: 28, cooldown: 1600, damage: 8.0,  range: 10.0 }

    # F → ПКМ — нова: кільце вогню розходиться від тебе
    nova:      { mana: 50, cooldown: 4000, damage: 9.0,  range: 9.0 }

    # Shift → ПКМ — стіна полум'я. Ще раз ПКМ (не відпускаючи Shift) —
    # запускає її вперед.  duration тут — скільки вона стоїть.
    wall:      { mana: 30, cooldown: 2500, damage: 3.0,  range: 3.2, duration: 160 }

    # Погляд↑ → ПКМ — метеор. Наводиться поглядом, поки летить.
    meteor:    { mana: 65, cooldown: 6000, damage: 20.0, range: 6.0 }

    # Погляд↓ → ПКМ — 6 стовпів полум'я лінією вперед, кидають угору
    pillar:    { mana: 34, cooldown: 2600, damage: 8.0,  range: 1.8 }

    # Q Q — щит: 8 магмових кубів на орбіті, відкидають при контакті
    aegis:     { mana: 35, cooldown: 5000, damage: 3.0,  range: 2.0, duration: 160 }

    # Q → ПКМ ПКМ — вихор: циліндр до 12 блоків, засмоктує, потім вибухає.
    # damage тут — урон фінального вибуху.
    inferno:   { mana: 90, cooldown: 9000, damage: 12.0, range: 6.5, duration: 100 }


# ═══════════════════════════════════════════════════════════ СТИХІЯ ЛЬОДУ ══
#
#  Лід — це контроль. Б'є слабше за вогонь, відкидає менше, але все
#  сповільнює й морозить. Форма на витривалість. Пасивка: холод не шкодить,
#  а у формі вода мерзне під ногами, як від льодоходів.
#
ice:

  # ─── ОСНОВНА АТАКА (ЛКМ) ───
  #
  # Заклікування розширює фронт, а не збільшує кулю: 1 → 3 → 5 → 7
  # осколків у шерензі. Тобто заряджений постріл — це лінія, яку не обійти.
  # Кількість завжди непарна, щоб була центральна смуга туди, куди цілиш.
  bolt:
    mana-base: 9
    mana-per-charge: 32

    # Сповільнення при влученні, у тіках. Мінімум — на слабкому пострілі,
    # максимум — на повному заряді.
    slow-min: 20
    slow-max: 80

    # 1 ОСКОЛОК
    tier-1:
      damage: 2.5
      knockback: 0.0

    # 3 ОСКОЛКИ в ряд
    tier-3:
      damage: 6.0
      knockback: 0.2

    # 5 ОСКОЛКІВ — сильніше сповільнення
    tier-5:
      damage: 9.0
      knockback: 0.45

    # 7 ОСКОЛКІВ — ще й коротке замороження
    tier-7:
      damage: 13.0
      knockback: 0.7

  # ─── ХУРТОВИНА (SHIFT + ЛКМ) ───
  #
  # Те саме, що вогнемет, але морозить замість палити.
  # Накопичує freeze — ванільний ефект як від пороху снігу.
  channel:
    mana: 3
    damage-min: 1.2
    damage-max: 2.8
    reach-min: 4.0
    reach-max: 11.0

  # ─── ФОРМА МОРОЗУ (тримати ПКМ 3 секунди) ───
  #
  # Корона з крижаних шпилів, броня, аура холоду на 4 блоки,
  # і вода мерзне під ногами. Вихід: Shift + S S.
  # Протилежність інферно: не догнати, а не дати від тебе піти.
  form:
    drain: 20
    minimum-mana: 0.25

  # ─── ЗАКЛЯТТЯ НА ЖЕСТАХ ───
  spells:
    # W W — ковзання вперед (пологіше за вогняний ривок)
    slide:     { mana: 12, cooldown: 600 }
    # S S — відступ назад
    backslide: { mana: 10, cooldown: 600 }
    # A A / D D — ухил убік
    dodge:     { mana: 10, cooldown: 600 }
    # Space Space — ковзанка вгору
    updraft:   { mana: 16, cooldown: 800 }

    # W W → ПКМ — крижаний шлях: 9 плит льоду лінією вперед, морозять
    rimeline:  { mana: 22, cooldown: 1500, damage: 4.0,  range: 1.8, duration: 120 }

    # F → ПКМ — домовина: найближчу ціль замикає в лід
    tomb:      { mana: 38, cooldown: 3500, damage: 6.0,  range: 6.0, duration: 80 }

    # Shift → ПКМ — крижана стіна з шипів. Ще раз ПКМ — запускає вперед.
    wall:      { mana: 30, cooldown: 2500, damage: 2.0,  range: 3.2, duration: 200 }

    # Погляд↑ → ПКМ — глетчер: перевернута крижана скеля з неба
    glacier:   { mana: 68, cooldown: 6500, damage: 17.0, range: 6.5 }

    # Погляд↓ → ПКМ — 6 крижаних шипів лінією вперед, тримають на місці
    spikes:    { mana: 30, cooldown: 2200, damage: 8.0,  range: 1.8, duration: 120 }

    # Q Q — обертень: 8 крижаних шпилів на орбіті, морозять при контакті
    aegis:     { mana: 32, cooldown: 5000, damage: 2.0,  range: 2.2, duration: 160 }

    # Q → ПКМ ПКМ — абсолютний нуль: воронка тримає всіх на місці,
    # потім усе вмерзле розбивається.  damage — урон за біт, фінал ×4.
    zero:      { mana: 88, cooldown: 9000, damage: 3.0,  range: 7.0, duration: 120 }
